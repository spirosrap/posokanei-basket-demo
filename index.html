<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Βρες το φθηνότερο πλάνο supermarket για το καλάθι σου με live τιμές από τον κατάλογο PosoKanei."
    />
    <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1210" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Καλάθι Τιμών Supermarket" />
    <meta property="og:title" content="Καλάθι Τιμών Supermarket" />
    <meta
      property="og:description"
      content="Φτιάξε τη λίστα σου και δες σε ποια supermarket θα την αγοράσεις φθηνότερα, με 1 έως 4 στάσεις."
    />
    <meta property="og:url" content="https://kalathitimon.com/" />
    <meta property="og:image" content="https://kalathitimon.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="el_GR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://images.weserv.nl" />
    <link rel="dns-prefetch" href="//images.weserv.nl" />
    <title>Καλάθι Τιμών Supermarket</title>
    <script>
      (() => {
        const path = window.location.pathname.replace(/\/+$/, "");
        const changesRoute = path.endsWith("/changes");
        const resource = changesRoute
          ? "data/price-changes-preview.json"
          : "data/catalog-bootstrap.json";
        const promiseKey = changesRoute
          ? "__priceChangesPreviewPromise"
          : "__catalogBootstrapPromise";
        const url = new URL(`%BASE_URL%${resource}`, window.location.origin);
        window[promiseKey] = fetch(url, {
          cache: "default",
          headers: { Accept: "application/json" },
          priority: "high",
        })
          .then((response) => {
            if (!response.ok) throw new Error(`early_data_${response.status}`);
            return response.json();
          })
          .catch(() => null);
      })();
    </script>
    <style>
      :root {
        --boot-bg: #f4f3ee;
        --boot-panel: #ffffff;
        --boot-border: #e2e0d8;
        --boot-ink: #1b201d;
        --boot-muted: #edece6;
        --boot-accent: #178a5d;
        --boot-blue: #2f66b3;
        --boot-amber: #b26d0b;
      }
      :root[data-theme="dark"] {
        --boot-bg: #0e1210;
        --boot-panel: #161b18;
        --boot-border: #2b332e;
        --boot-ink: #e9ede9;
        --boot-muted: #232a26;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-ink);
        font-family: "Commissioner Variable", Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-shell { width: min(100% - 28px, 1510px); margin: 0 auto; padding: 10px 0 24px; }
      .boot-header { height: 46px; display: flex; align-items: center; gap: 10px; }
      .boot-mark { width: 40px; height: 40px; border-radius: 13px; background: var(--boot-accent); }
      .boot-brand { display: grid; gap: 6px; }
      .boot-brand strong { font-size: 17px; line-height: 1; }
      .boot-brand small { color: #687487; font-size: 11px; }
      :root[data-theme="dark"] .boot-brand small { color: #aab5c3; }
      .boot-copy-en { display: none; }
      :root[data-boot-language="en"] .boot-copy-el { display: none; }
      :root[data-boot-language="en"] .boot-copy-en { display: inline; }
      .boot-line { display: block; height: 10px; border-radius: 4px; background: var(--boot-muted); }
      .boot-grid { display: grid; grid-template-columns: minmax(280px, .95fr) minmax(360px, 1.35fr) minmax(300px, 1fr); gap: 12px; margin-top: 10px; }
      .boot-panel { min-height: 510px; padding: 15px; border: 1px solid var(--boot-border); border-radius: 18px; background: var(--boot-panel); }
      .boot-panel-head { display: flex; align-items: center; gap: 9px; padding-bottom: 14px; border-bottom: 1px solid var(--boot-border); }
      .boot-square { width: 30px; height: 30px; border-radius: 6px; background: var(--boot-muted); }
      .boot-panel-head .boot-line { width: 92px; height: 13px; }
      .boot-bar { height: 46px; margin: 12px 0; border: 1px solid var(--boot-border); border-radius: 999px; background: var(--boot-bg); }
      .boot-row { display: grid; grid-template-columns: 42px 1fr 66px; gap: 10px; align-items: center; min-height: 66px; margin-top: 8px; padding: 8px; border: 1px solid var(--boot-border); border-radius: 7px; }
      .boot-row .boot-square { width: 42px; height: 42px; }
      .boot-copy { display: grid; gap: 7px; }
      .boot-copy .boot-line:first-child { width: min(100%, 210px); }
      .boot-copy .boot-line:last-child { width: min(70%, 120px); height: 8px; }
      .boot-price { width: 56px; height: 14px; justify-self: end; }
      .boot-line, .boot-square, .boot-bar { animation: boot-pulse 1.2s ease-in-out infinite alternate; }
      @keyframes boot-pulse { from { opacity: .58; } to { opacity: 1; } }
      @media (max-width: 900px) {
        .boot-shell { width: min(100% - 20px, 620px); }
        .boot-grid { grid-template-columns: 1fr; }
        .boot-panel { display: none; min-height: 600px; }
        .boot-panel:nth-child(3) { display: block; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-line, .boot-square, .boot-bar { animation: none; }
      }
    </style>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("posokanei-theme") || "system";
          const savedLanguage = localStorage.getItem("posokanei-language") || "el";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const resolvedTheme =
            savedTheme === "dark" || (savedTheme === "system" && prefersDark)
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.dataset.themePreference = savedTheme;
          document.documentElement.dataset.bootLanguage = savedLanguage === "en" ? "en" : "el";
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.bootLanguage = "el";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-label="Loading application">
        <div class="boot-header">
          <span class="boot-mark"></span>
          <span class="boot-brand">
            <strong><span class="boot-copy-el">Καλάθι Τιμών</span><span class="boot-copy-en">Supermarket Price Basket</span></strong>
            <small><span class="boot-copy-el">Φόρτωση καταλόγου...</span><span class="boot-copy-en">Loading catalogue...</span></small>
          </span>
        </div>
        <div class="boot-grid">
          <section class="boot-panel">
            <div class="boot-panel-head"><span class="boot-square"></span><span class="boot-line"></span></div>
            <div class="boot-bar"></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
          </section>
          <section class="boot-panel">
            <div class="boot-panel-head"><span class="boot-square"></span><span class="boot-line"></span></div>
            <div class="boot-bar"></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
          </section>
          <section class="boot-panel">
            <div class="boot-panel-head"><span class="boot-square"></span><span class="boot-line"></span></div>
            <div class="boot-bar"></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
            <div class="boot-row"><span class="boot-square"></span><span class="boot-copy"><span class="boot-line"></span><span class="boot-line"></span></span><span class="boot-line boot-price"></span></div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx" fetchpriority="high"></script>
  </body>
</html>
