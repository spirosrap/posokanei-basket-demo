name: Catalogue refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the public PosoKanei API
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --compressed \
            --max-time 30 \
            --output /tmp/posokanei-stats.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header 'Accept-Language: el-GR,el;q=0.9,en;q=0.8' \
            --header 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' \
            https://api.posokanei.gov.gr/meta/stats)"
          echo "PosoKanei status: ${status}"
          test "${status}" = "200"
          jq '{total_products, active_products, retailer_count}' /tmp/posokanei-stats.json
